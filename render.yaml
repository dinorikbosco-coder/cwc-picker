databases:
  - name: cwc-picker-db
    plan: free
    databaseName: cwc
    user: cwc

services:
  - type: web
    name: cwc-picker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cwc-picker-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
